version: '3'

services:

  frontend:
    labels:
      shipyard.route: '/'
    build: 'frontend'
    environment:
      CI: 'true'
      DANGEROUSLY_DISABLE_HOST_CHECK: 'true'
    env_file:
      - frontend/frontend.env
    volumes:
      - './frontend/src:/app/src'
      - './frontend/public:/app/public'
    ports:
      - '3000:3000'
    depends_on:
      - backend

  backend:
    labels:
      shipyard.route: '/api'
    build: 'backend'
    environment:
      DATABASE_URL: 'postgres://obscure-user:obscure-password@postgres/app'
      DEV: ${DEV}
      FLASK_DEBUG: '1'
      LOCALSTACK_HOST: 'localstack'
      UPLOAD_MODE: ${UPLOAD_MODE:-celery}
    volumes:
      - './backend/filesystem/entrypoints:/entrypoints:ro'
      - './backend/migrations:/srv/migrations'
      - './backend/src:/srv/src:ro'
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: 'service_healthy'
      redis:
        condition: 'service_healthy'
      localstack:
        condition: 'service_healthy'
      migrate:
        condition: 'service_completed_successfully'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: '10s'
      timeout: '5s'
      retries: 12
      start_period: '20s'

  worker:
    labels:
      shipyard.init: 'poetry run flask db upgrade'
    build: 'backend'
    environment:
      DATABASE_URL: 'postgres://obscure-user:obscure-password@postgres/app'
      DEV: ${DEV}
      FLASK_DEBUG: '1'
      LOCALSTACK_HOST: 'localstack'
      UPLOAD_MODE: ${UPLOAD_MODE:-celery}
    command: '/entrypoints/worker.sh'
    volumes:
      - './backend/filesystem/entrypoints:/entrypoints:ro'
      - './backend/migrations:/srv/migrations'
      - './backend/src:/srv/src:ro'
      - './backend/tests:/srv/tests:ro'
      - './backend/conftest.py:/srv/conftest.py:ro'
    depends_on:
      postgres:
        condition: 'service_healthy'
      redis:
        condition: 'service_healthy'
      localstack:
        condition: 'service_healthy'
      migrate:
        condition: 'service_completed_successfully'
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f celery > /dev/null || exit 1']
      interval: '15s'
      timeout: '5s'
      retries: 5
      start_period: '30s'

  migrate:
    build: 'backend'
    environment:
      DATABASE_URL: 'postgres://obscure-user:obscure-password@postgres/app'
      LOCALSTACK_HOST: 'localstack'
    command: 'poetry run flask db upgrade'
    volumes:
      - './backend/filesystem/entrypoints:/entrypoints:ro'
      - './backend/migrations:/srv/migrations'
      - './backend/src:/srv/src:ro'
    depends_on:
      postgres:
        condition: 'service_healthy'

  postgres:
    image: 'postgres:9.6-alpine'
    environment:
      POSTGRES_USER: 'obscure-user'
      POSTGRES_PASSWORD: 'obscure-password'
      POSTGRES_DB: 'app'
      PGDATA: '/var/lib/postgresql/data/pgdata'
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    ports:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U obscure-user -d app']
      interval: '5s'
      timeout: '3s'
      retries: 20

  redis:
    image: 'redis:5.0-alpine'
    ports:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: '5s'
      timeout: '3s'
      retries: 20

  localstack:
    image: 'localstack/localstack:2.3.0'
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: '5s'
      timeout: '5s'
      retries: 24
      start_period: '15s'

volumes:
  postgres:
  localstack:
